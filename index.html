    let currentUnit = 1;
    let isJpHiddenGlobal = false;
    let userInputs = {};
    let gradedStates = {};

    function renderTable() {
        const tbody = document.getElementById('idiom-tbody');
        tbody.innerHTML = '';

        const currentItems = idiomData.filter(item => item.unit === currentUnit);
        
        document.getElementById('unit-title').innerText = unitTitles[currentUnit] || `UNIT ${currentUnit}`;

        for (let i = 1; i <= 20; i++) {
            const btn = document.getElementById(`btn-u${i}`);
            if (btn) btn.classList.toggle('active', currentUnit === i);
        }

        currentItems.forEach(item => {
            const tr = document.createElement('tr');
            const userVal = userInputs[item.id] || '';
            const isGraded = gradedStates[item.id] || false;

            let exampleElemHtml = `${item.ex_en_pre} <span class="ex-blank">(   )</span> ${item.ex_en_post}`;
            if (isGraded) {
                exampleElemHtml = `${item.ex_en_pre} <span class="ex-revealed">( ${item.prep} )</span> ${item.ex_en_post}`;
            }

            tr.innerHTML = `
                <td class="pc-only-col" style="color:#64748b; font-weight:bold;">${item.id}</td>
                <td class="pc-only-col">
                    <button class="audio-btn" title="音声再生" onclick="playAudio('${item.speech_text}')">🔊</button>
                </td>
                <td>
                    <!-- スマホ用カードヘッダー (#番号 ＆ 音声ボタン) -->
                    <div class="card-header-mobile">
                        <span class="item-number-tag">#${item.id}</span>
                        <button class="audio-btn" title="音声再生" onclick="playAudio('${item.speech_text}')">🔊 発音</button>
                    </div>

                    <div class="problem-row-mobile">
                        <strong>${item.prefix}</strong>
                        <input type="text" 
                               class="input-answer" 
                               id="input-${item.id}" 
                               value="${userVal}" 
                               placeholder="(   )" 
                               autocomplete="off"
                               autocorrect="off"
                               autocapitalize="off"
                               spellcheck="false"
                               onkeydown="if(event.key==='Enter') gradeSingle(${item.id})"
                               oninput="userInputs[${item.id}] = this.value">
                        <strong>${item.suffix}</strong>
                        <button class="btn-single-check" onclick="gradeSingle(${item.id})">判定</button>
                        <span id="badge-${item.id}" class="status-badge"></span>
                    </div>
                    <span id="ans-text-${item.id}" class="correct-answer-text"></span>
                    <span class="badge-note ${item.badgeType}">${item.note}</span>
                </td>
                <td>
                    <span class="jp-text ${isJpHiddenGlobal ? 'hidden' : ''}" onclick="this.classList.toggle('hidden')">${item.jp}</span>
                </td>
                <td>
                    <div id="ex-container-${item.id}" style="font-size:14px; color:#1e293b;">${exampleElemHtml}</div>
                    <div style="font-size:12px; color:#64748b;">${item.ex_jp}</div>
                </td>
                <td>
                    <span id="result-status-${item.id}" style="font-weight:bold; font-size:13px; color:#64748b;">未解答</span>
                </td>
            `;
            tbody.appendChild(tr);

            if (isGraded) {
                gradeSingle(item.id, false);
            }
        });

        updateScoreDisplay();
    }

    function gradeSingle(id, updateData = true) {
        const item = idiomData.find(d => d.id === id);
        const inputElem = document.getElementById(`input-${id}`);
        const badgeElem = document.getElementById(`badge-${id}`);
        const ansElem = document.getElementById(`ans-text-${id}`);
        const statusElem = document.getElementById(`result-status-${id}`);
        const exContainer = document.getElementById(`ex-container-${id}`);

        if (!inputElem) return;

        const typed = inputElem.value.trim().toLowerCase();
        const correct = item.prep.trim().toLowerCase();

        if (typed === "") {
            inputElem.className = "input-answer";
            badgeElem.innerText = "";
            ansElem.innerText = "";
            statusElem.innerText = "未解答";
            statusElem.style.color = "#64748b";
            if (exContainer) {
                exContainer.innerHTML = `${item.ex_en_pre} <span class="ex-blank">(   )</span> ${item.ex_en_post}`;
            }
            if (updateData) delete gradedStates[id];
            return;
        }

        if (updateData) gradedStates[id] = true;

        if (exContainer) {
            exContainer.innerHTML = `${item.ex_en_pre} <span class="ex-revealed">( ${item.prep} )</span> ${item.ex_en_post}`;
        }

        if (typed === correct) {
            inputElem.className = "input-answer correct";
            badgeElem.innerText = "⭕️";
            badgeElem.className = "status-badge ok";
            ansElem.innerText = "";
            statusElem.innerText = "正解 ⭕️";
            statusElem.style.color = "#15803d";
        } else {
            inputElem.className = "input-answer wrong";
            badgeElem.innerText = "❌";
            badgeElem.className = "status-badge ng";
            ansElem.innerText = `正解: ${item.prep}`;
            statusElem.innerText = "不正解 ❌";
            statusElem.style.color = "#b91c1c";
        }

        updateScoreDisplay();
    }

  function gradeAllAnswers() {
        const currentItems = idiomData.filter(item => item.unit === currentUnit);
        currentItems.forEach(item => gradeSingle(item.id));

        // ★ ここから送信処理を追加
        if (window.sendResultToFirebase) {
            let correctCount = 0;
            currentItems.forEach(item => {
                const inputElem = document.getElementById(`input-${item.id}`);
                if (inputElem) {
                    const typed = inputElem.value.trim().toLowerCase();
                    const correct = item.prep.trim().toLowerCase();
                    if (typed === correct && typed !== "") {
                        correctCount++;
                    }
                }
            });
            window.sendResultToFirebase("中学英熟語", `Unit ${currentUnit}`, correctCount, currentItems.length);
        }
    }

    function switchUnit(unitNum) {
        currentUnit = unitNum;
        renderTable();
    }

    function toggleAllJapanese() {
        isJpHiddenGlobal = !isJpHiddenGlobal;
        renderTable();
    }

    function resetAllInputs() {
        const currentItems = idiomData.filter(item => item.unit === currentUnit);
        currentItems.forEach(item => {
            delete userInputs[item.id];
            delete gradedStates[item.id];
        });
        renderTable();
    }

    function updateScoreDisplay() {
        const currentItems = idiomData.filter(item => item.unit === currentUnit);
        let correctCount = 0;

        currentItems.forEach(item => {
            const inputElem = document.getElementById(`input-${item.id}`);
            if (inputElem) {
                const typed = inputElem.value.trim().toLowerCase();
                const correct = item.prep.trim().toLowerCase();
                if (typed === correct && typed !== "") {
                    correctCount++;
                }
            }
        });

        document.getElementById('score-display').innerText = `スコア: ${correctCount} / ${currentItems.length}`;
    }

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        } else {
            alert('お使いのブラウザは音声読み上げに対応していません。');
        }
    }

    renderTable();
</script>
